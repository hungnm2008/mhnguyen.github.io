# about me
first-paragraph: I am a PhD student at the <a href="https://www.mpi-sws.org/" target="_blank" rel="noopener">Max Planck Institute for Software Systems (MPI-SWS)</a>, supervised by <a href="https://machineteaching.mpi-sws.org/adishsingla.html" target="_blank" rel="noopener">Adish Singla</a>. My current research interests include <code>Pluralistic AI</code>, <code>Diversity & Creativity of LLMs</code>, and <code>GenAI for Education</code>.
second-paragraph: Prior to this, I obtained my M.Sc. in Big Data Management and Analytics jointly from Universit&eacute; Paris-Saclay, UPC Barcelona, and ULB Brussels, fully funded by the European Union. My master's thesis was completed at INRIA, supervised by <a href="https://scholar.google.com/citations?user=d_4MbDQAAAAJ&hl=en" target="_blank" rel="noopener">Isabelle Guyon</a> and <a href="https://www.semanticscholar.org/author/Lisheng-Sun-Hosoya/1414759964" target="_blank" rel="noopener">Lisheng Sun-Hosoya</a>, where I worked on AutoML and reinforcement learning.
